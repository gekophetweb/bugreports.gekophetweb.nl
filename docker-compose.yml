# Project name: containers, networks and volumes are prefixed "bugreports-" / "bugreports_".
name: bugreports

# The website (app, queue, scheduler) and the database run in separate containers.
# The database and Redis sit on the internal "backend" network only and are never published.
#
# .env is bind-mounted read-only, so values are read by the app on every start.
# APP_KEY is generated on first start into storage/app/.env.local (app_storage volume),
# which wins over .env. Mail and SSO are configured by the superadmin in the website.

x-app: &app
  build: { context: ., target: app }
  volumes:
    - ./.env:/app/.env:ro
    - app_storage:/app/storage
  restart: unless-stopped

services:
  app:
    <<: *app
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [frontend, backend]
    ports:
      # localhost only; APP_PORT in .env picks the host port. The Cloudflare tunnel reaches app:8000 directly.
      - "127.0.0.1:${APP_PORT:-8000}:8000"

  # Syncs and notification fan-out (long jobs, up to 15 minutes).
  queue:
    <<: *app
    command: php artisan queue:work --queue=default --tries=3 --timeout=900 --max-time=3600
    healthcheck: { disable: true }
    depends_on:
      app: { condition: service_healthy }
    # frontend for internet access: fetching from OSV/NVD.
    networks: [frontend, backend]

  # Emails only (sign-in codes, alerts, digests), so they never wait behind a sync.
  mail-queue:
    <<: *app
    command: php artisan queue:work --queue=mail --tries=3 --timeout=120 --max-time=3600
    healthcheck: { disable: true }
    depends_on:
      app: { condition: service_healthy }
    networks: [frontend, backend]

  scheduler:
    <<: *app
    command: php artisan schedule:work
    healthcheck: { disable: true }
    depends_on:
      app: { condition: service_healthy }
    networks: [backend]

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      retries: 5
    networks: [backend]
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
    networks: [backend]
    restart: unless-stopped

  # Cloudflare Tunnel. Start with: docker compose --profile tunnel up -d
  # In Cloudflare Zero Trust, point the public hostname at http://app:8000.
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.10.7
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [app]
    networks: [frontend]
    restart: unless-stopped

networks:
  frontend:
    ipam:
      config:
        - subnet: 172.29.0.0/24
  backend:
    internal: true

volumes:
  db_data:
  app_storage:
